<header class="nav">

  <a routerLink="/" class="brand">
    <img
      src="/logo.jpg"
      alt="Džemat Bochum"
      class="logo"
    >
  </a>

  <nav class="nav-links">

    <a routerLink="/">{{i18n.t('home')}}</a>

    <a routerLink="/about">
      {{i18n.t('about')}}
    </a>

    @if (auth.isLoggedIn()) {

      <a routerLink="/upload">
        {{i18n.t('upload')}}
      </a>

      <button
        type="button"
        (click)="auth.logout()"
      >
        {{i18n.t('logout')}}
      </button>

      @if (auth.user()?.picture) {
        <img
          class="avatar"
          [src]="auth.user()?.picture"
          alt="Profil"
        >
      }

    } @else {

      <a routerLink="/login">
        {{i18n.t('login')}}
      </a>

    }

    <app-language-switcher></app-language-switcher>
  </nav>

</header>

<main class="shell">
  <router-outlet></router-outlet>
</main>
<footer class="legal-footer"><a href="/datenschutz.html">Datenschutz</a><a href="/impressum.html">Impressum</a></footer>
